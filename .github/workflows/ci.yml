name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --- userspace: daemon + mock, no kernel module and no root needed ---
  userspace:
    name: userspace build + mock suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build with warnings-as-errors, run the full mock suite
        run: make ci

      - name: Build the privilege-drop test helper (compile check only)
        run: make CFLAGS="-O2 -Wall -Wextra -Werror" priv-drop-test

      - name: Build the render-hook test helper (compile check only)
        run: make CFLAGS="-O2 -Wall -Wextra -Werror" render-hook-test

      - name: Build the mount-namespace test helper (compile check only)
        run: make CFLAGS="-O2 -Wall -Wextra -Werror" mount-ns-test

      # Dry run only -- against the mock, not a real kernel module, so
      # this proves the harness itself is correct (doesn't crash from its
      # own bugs, exercises every ioctl), not that the kernel survives
      # malformed input. IOCTL_FUZZ_SAFE_POINTERS_ONLY=1 because the mock
      # is plain userspace code with no copy_from_user()/access_ok() of
      # its own -- handing it a NULL/unmapped/wild pointer crashes the
      # mock, not the module under test. See ioctl_fuzz.c's own header
      # comment and README's "ioctl fuzzing" section for the real run
      # (root, a loaded module, full pointer-corruption fuzzing included).
      - name: ioctl fuzz harness dry run against the mock (no root)
        run: |
          make CFLAGS="-O2 -Wall -Wextra -Werror" ioctl-fuzz mock daemon
          LD_PRELOAD="$PWD/test/libmock_anticheat.so" \
            AC_MOCK_ROOT=1 \
            AC_MOCK_STATE="/tmp/ac_mock_fuzz_state_ci" \
            IOCTL_FUZZ_SAFE_POINTERS_ONLY=1 \
            ./test/ioctl_fuzz 1000 20260818

      - name: Ban-pipeline server test (no root, pure Python + HTTP)
        run: ./server/test_server.sh

      - name: RateLimiter bucket-pruning unit test (no root, no network)
        run: python3 server/test_ratelimiter_unit.py

      - name: Store per-client report retention unit test (no root, no network)
        run: python3 server/test_store_retention_unit.py

      - name: Reports global quota + pagination unit test (no root, no network)
        run: python3 server/test_reports_pagination_quota_unit.py

      - name: Server auth-dispatch + trusted-proxy unit test (no root, no network)
        run: python3 server/test_auth_dispatch_unit.py

      # A rebase, auto-fix commit, or artifact re-download can silently
      # drop a script's mode from 100755 to 100644 (this happened to
      # scripts/kasan_boot_test.sh once, and only surfaced when the
      # nightly kasan-boot.yml workflow failed trying to exec it). Catch
      # that regression class here, in the PR that introduces it, rather
      # than waiting on whichever scheduled workflow happens to invoke
      # the affected script next.
      - name: Verify scripts kept their executable bit
        run: |
          fail=0
          while IFS= read -r f; do
            if [ ! -x "$f" ]; then
              echo "::error file=$f::executable bit missing (mode $(stat -c%a "$f"))"
              fail=1
            fi
          done < <(git ls-files '*.sh')
          exit "$fail"

      - name: Shellcheck the shell scripts
        run: |
          command -v shellcheck >/dev/null 2>&1 || \
            { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          git ls-files '*.sh' | xargs shellcheck

  # --- kernel module: compile smoke test against a pinned modern tree ---
  # The module targets kernels >= 6.12 (uses sized_strscpy, the _noprof
  # allocators, for_class_mod_mem_type, maple-tree VMA iteration).  CI
  # prepares a linux-6.12 LTS source tree with defconfig and builds the LKM
  # against it, so the build is deterministic and independent of the runner's
  # own (older) kernel headers.
  module:
    name: kernel module build (linux-6.12 headers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc flex bison libelf-dev libssl-dev dwarves

      - name: Fetch and prepare kernel headers (6.12 LTS, x86_64)
        run: |
          # --retry-all-errors: a plain `curl -fsSL | tar -xJ` pipe seen
          # failing in practice with a mid-stream HTTP/2 PROTOCOL_ERROR
          # from cdn.kernel.org, which curl's default retry logic doesn't
          # cover (it only retries clear-cut connect/timeout failures).
          # Downloading to a file first, rather than piping straight into
          # tar, also avoids a real correctness risk of retrying into a
          # live pipe: a retried request re-emits the full file from byte
          # 0, and tar would receive that appended after whatever partial
          # bytes the first, failed attempt already wrote -- a corrupt
          # archive that looks like a retry succeeded when it didn't.
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            -o linux-6.12.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.tar.xz
          curl -fsSL -o sha256sums.asc \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/sha256sums.asc
          grep "linux-6.12.tar.xz" sha256sums.asc | sha256sum -c -
          tar -xJf linux-6.12.tar.xz
          rm -f linux-6.12.tar.xz
          make -C linux-6.12 ARCH=x86_64 defconfig
          # defconfig alone leaves module signing off, so modules_prepare
          # below never builds scripts/sign-file -- the DKMS build +
          # signing smoke test step further down needs that tool; without
          # it DKMS silently skips signing and that step's own
          # `grep -q sig_id` assertion fails.
          #
          # MODULE_SIG_HASH has no prompt of its own -- it's a plain
          # `string` symbol whose value is derived entirely from which
          # MODULE_SIG_SHA* boolean choice is enabled (see kernel/module/
          # Kconfig). Setting it directly via --set-val looked like it
          # worked, but olddefconfig recomputes it from the choice on the
          # next line and silently discards the forced value -- verified
          # against a real build: it landed on sha1 (this kernel's
          # apparent choice default), not sha256, even though the .config
          # line briefly said otherwise. Enable the actual choice symbol
          # instead so the derived value is stable under olddefconfig.
          ./linux-6.12/scripts/config --file linux-6.12/.config \
            --enable MODULE_SIG \
            --enable MODULE_SIG_SHA256
          make -C linux-6.12 ARCH=x86_64 olddefconfig
          grep -qx 'CONFIG_MODULE_SIG_SHA256=y' linux-6.12/.config
          grep -qx 'CONFIG_MODULE_SIG_HASH="sha256"' linux-6.12/.config
          make -C linux-6.12 ARCH=x86_64 scripts
          make -C linux-6.12 ARCH=x86_64 modules_prepare

      - name: Build the LKM
        run: |
          # First pass compiles the module; the final modpost link fails only
          # because the prepared tree has no Module.symvers.  Synthesize one
          # from the objects' undefined symbols so the link (a compile smoke
          # test) succeeds.  Real load-time symbol resolution is validated on
          # a live kernel (see diag.sh).
          #
          # Read the object list from the Makefile's own anticheat-objs
          # rather than hardcoding it here a second time -- src/sha256.o
          # (added for #63) calling memcpy() is exactly the kind of
          # newly-linked-in undefined symbol a hardcoded, stale list here
          # would silently drop from ksymvers and fail modpost on.
          #
          # nm printing more than one file at once inserts a "path:"
          # header line per file into the stream; NF==2 keeps only real
          # "U symbolname" lines (2 whitespace-separated fields) and
          # drops those headers (1 field) and the blank separator lines
          # nm puts around them, which the plain `{print $2}` used when
          # there was only ever one object here happily let through as a
          # symbol-less entry -- and modpost's dump-file parser rejects
          # that outright with "parse error in symbol dump file".
          make KDIR="$PWD/linux-6.12" module 2>&1 | tail -3 || true
          objs="$(grep '^anticheat-objs' Makefile | cut -d= -f2)"
          nm -u $objs | awk 'NF==2 {print $2}' | sort -u | \
            awk '{printf "0x00000000\t%s\tvmlinux\tEXPORT_SYMBOL\t\n", $1}' \
            > "$PWD/ksymvers"
          make KDIR="$PWD/linux-6.12" KBUILD_EXTRA_SYMBOLS="$PWD/ksymvers" module
          test -s anticheat.ko
          modinfo ./anticheat.ko | head -6

      - name: Upload module artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: anticheat-ko
          path: anticheat.ko
          if-no-files-found: error

      # --- static analysis (sparse) ---
      # Kbuild has first-class sparse support built in (C=1/C=2), so this
      # needs no custom integration -- just the tool and a re-invocation
      # of the same build with checking turned on. C=2 (not C=1) is used
      # deliberately: C=1 only re-checks files Kbuild decides need
      # recompiling, and anticheat_module.o was already built to
      # completion by the step above; C=2 forces sparse over every file
      # regardless of up-to-date status. Reuses the same prepared tree
      # and the ksymvers workaround from the build step above -- no
      # separate kernel fetch, no `make clean` needed (the changed
      # C=2/CF= flags alone are enough for Kbuild's .cmd dependency
      # tracking to recompile the object under sparse this time).
      #
      # Fails the job on any finding. The first run against this module
      # (before this comment existed) came back completely clean -- zero
      # warnings across the whole ~1400 lines of hand-rolled kprobe/
      # syscall-table code -- so there's a real, verified-clean baseline
      # to hold, not a guess that one exists.
      - name: Static analysis (sparse)
        run: |
          sudo apt-get install -y -qq sparse
          make KDIR="$PWD/linux-6.12" KBUILD_EXTRA_SYMBOLS="$PWD/ksymvers" \
            C=2 CF="-D__CHECK_ENDIAN__" module 2>&1 | tee sparse.log
          if grep -qE '(warning|error):' sparse.log; then
            echo "::error::sparse reported findings -- see the job log above"
            exit 1
          fi
          echo "sparse: no findings"

      - name: Upload sparse log
        # Steps default to if: success(), which would skip this exact
        # step precisely when it's most wanted: the sparse step above
        # exits 1 on a finding, and without this override the log a
        # failure needs to be diagnosed would never make it off the
        # runner. !cancelled() runs regardless of the sparse step's own
        # outcome, only skipping on a cancelled workflow (where the log
        # may never have been written at all).
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sparse-log
          path: sparse.log
          if-no-files-found: error

      # --- DKMS path: exercises dkms.conf + Secure Boot signing end to end ---
      # This is the same packaging a player's machine actually uses (see
      # scripts/dkms-install.sh), not just a raw `make module`. It reuses
      # the already-prepared 6.12 tree above instead of the runner's own
      # kernel, since DKMS always targets a specific kernel version's
      # module tree and the runner's live kernel has no matching headers.
      - name: DKMS build + signing smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dkms

          # Read from dkms.conf rather than hardcoding "1.0.0" here: unlike
          # release.yml's check-version job, nothing else in this workflow
          # would catch this drifting from dkms.conf's own PACKAGE_VERSION
          # if it's ever bumped without updating this step too.
          PKG_VER="$(awk -F'"' '/^PACKAGE_VERSION=/{print $2}' dkms.conf)"

          # Point DKMS at the prepared tree via a synthetic version + a
          # /lib/modules/<ver>/build symlink -- the same shape a real
          # kernel-postinst hook sees for a just-installed, not-yet-booted
          # kernel.
          KVER="$(make -s -C linux-6.12 kernelversion)-ci"
          sudo mkdir -p "/lib/modules/${KVER}"
          sudo ln -sf "$PWD/linux-6.12" "/lib/modules/${KVER}/build"

          # Same setup scripts/dkms-install.sh does: a system-wide
          # framework.conf.d fragment pointing DKMS's built-in signing at a
          # key it will self-generate, plus the parent directory it won't
          # create on its own. (DKMS ignores MOK_SIGNING_KEY/MOK_CERTIFICATE
          # if set directly in dkms.conf -- verified against a real build;
          # only the system-wide framework.conf(.d) path actually wires up
          # signing. See the note in dkms.conf.)
          sudo install -d -m 0700 /var/lib/anticheat/mok
          sudo install -d -m 0755 /etc/dkms/framework.conf.d
          printf 'mok_signing_key="/var/lib/anticheat/mok/mok.priv"\nmok_certificate="/var/lib/anticheat/mok/mok.der"\n' \
            | sudo tee /etc/dkms/framework.conf.d/anticheat.conf >/dev/null

          sudo mkdir -p "/usr/src/anticheat-${PKG_VER}"
          sudo cp -a Makefile dkms.conf src "/usr/src/anticheat-${PKG_VER}/"

          sudo dkms add -m anticheat -v "$PKG_VER"

          # Same undefined-symbol workaround as the manual build above: the
          # prepared-but-never-linked tree has no Module.symvers.
          sudo env KBUILD_EXTRA_SYMBOLS="$PWD/ksymvers" \
            dkms build -m anticheat -v "$PKG_VER" -k "$KVER"

          sudo dkms status -m anticheat
          built_ko="$(find "/var/lib/dkms/anticheat/${PKG_VER}/${KVER}" \
            -name 'anticheat.ko' -print -quit)"
          test -n "$built_ko" && test -s "$built_ko"
          # sig_id alone only proves *some* signature was applied, not
          # which hash -- check sig_hashalgo too, the actual built-module
          # confirmation that the sha256 requested in .config (checked
          # earlier, before the build) is what really got used.
          modinfo_out="$(modinfo "$built_ko" | tee /dev/stderr)"
          printf '%s' "$modinfo_out" | grep -q '^sig_id:\s*PKCS#7$'
          printf '%s' "$modinfo_out" | grep -q '^sig_hashalgo:\s*sha256$'

  # --- path filter: only the real-module fuzz seed job below is gated on
  # this. userspace/module above always run -- CONTRIBUTING.md documents
  # ci.yml as always running on every push/PR, and this filter must not
  # change that for the jobs that already existed. ---
  changes:
    name: detect kernel module changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      module: ${{ steps.filter.outputs.module }}
    steps:
      # fetch-depth: 0 -- paths-filter needs real git history to diff
      # against (push events default to comparing HEAD^1..HEAD, pull_request
      # events compare against the PR base); the default shallow (depth 1)
      # checkout has neither, which would force it into the GitHub REST API
      # fallback path (needing broader permissions this workflow doesn't
      # otherwise grant) or fail outright on a push event.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check whether kernel module sources changed
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            module:
              - 'src/**'
              - 'src/anticheat.h'
              - 'Makefile'
              - 'dkms.conf'
              - 'src/sha256.*'

  # --- real-module fuzz seed: short KASAN run against the actual module ---
  # THREAT_MODEL.md's "What 'production-ready' claims today" section
  # documents this exact gap: every push only runs ioctl_fuzz's dry run
  # against the userspace mock (proves the harness, not the kernel --
  # the mock has none of copy_from_user()/access_ok() to stress), while
  # the real run -- root, the real loaded module, full pointer-corruption
  # fuzzing, watching dmesg -- was nightly-only via kasan-boot.yml. See
  # https://github.com/keanehatescoding/anticheat/issues/68.
  #
  # This job closes part of that gap on every PR/push that touches the
  # module itself, without paying nightly's full cost on every push: it
  # reuses scripts/kasan_boot_test.sh verbatim (same KASAN+lockdep kernel
  # build, same VM boot via virtme-ng, same dmesg oops/WARNING/KASAN/GPF
  # grep as the pass/fail gate) rather than reinventing any of that here,
  # and only shortens the fuzz run itself via the script's existing
  # IOCTL_FUZZ_ITERATIONS knob (already used by kasan-boot.yml's own
  # workflow_dispatch input -- no script changes needed). 50
  # iterations-per-command (vs nightly's default 300) is a heuristic
  # aimed at the issue's ~30s target for the fuzz portion specifically;
  # ioctl_fuzz.c's tight loop has no per-call sleep, so wall-clock scales
  # roughly with iteration count, but this can't be precisely benchmarked
  # without actually running the workflow on GitHub Actions -- see the PR
  # description. The kernel build + VM boot around it still take minutes
  # regardless of iteration count, same as kasan-boot.yml.
  kasan-fuzz-seed:
    name: real-module ioctl fuzz seed (KASAN, short)
    needs: changes
    if: needs.changes.outputs.module == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # persist-credentials: false -- same reasoning as kasan-boot.yml:
      # no later step needs authenticated git access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install kernel build deps, QEMU, and virtme-ng
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc flex bison libelf-dev libssl-dev dwarves qemu-system-x86
          # pipx, not pip: recent Ubuntu images mark the system Python as
          # externally-managed (PEP 668), so a plain `pip install --user`
          # fails outright; pipx is GitHub's own documented workaround for
          # installing a CLI tool like this without a hand-rolled venv.
          pipx install virtme-ng
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Best-effort only, same as kasan-boot.yml: GitHub doesn't document
      # or guarantee /dev/kvm on hosted runners. When this doesn't pan
      # out, kasan_boot_test.sh still runs -- vng transparently falls
      # back to QEMU/TCG, just much slower. Never fail the job over this
      # step itself.
      - name: Attempt to enable /dev/kvm (best effort, non-fatal)
        run: |
          if [ -e /dev/kvm ]; then
            echo "/dev/kvm already present"
          else
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules || true
            sudo udevadm trigger --name-match=kvm || true
          fi
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "kvm=available"
          else
            echo "kvm=unavailable -- falling back to QEMU/TCG (slower, not fatal)"
          fi

      - name: Boot the KASAN+lockdep kernel and run a short real ioctl fuzz seed
        env:
          IOCTL_FUZZ_ITERATIONS: "50"
        run: |
          # A fresh seed every run, same reasoning as kasan-boot.yml: repeated
          # runs across PR pushes accumulate fuzzing coverage instead of
          # replaying the identical sequence forever -- printed up front so
          # any failure is reproducible locally via the same
          # IOCTL_FUZZ_SEED value.
          export IOCTL_FUZZ_SEED
          IOCTL_FUZZ_SEED="$(date +%s)"
          echo "IOCTL_FUZZ_SEED=$IOCTL_FUZZ_SEED"
          ./scripts/kasan_boot_test.sh

      - name: Upload console log and built module on failure
        # cancelled(), not just failure(): a timeout-minutes cancellation
        # is a distinct workflow conclusion from failure() and would
        # otherwise skip this step precisely when the partial console log
        # is most useful for diagnosing where it hung.
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kasan-fuzz-seed-failure
          path: |
            kasan-console.log
            anticheat.ko
          if-no-files-found: ignore
