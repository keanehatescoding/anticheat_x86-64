name: Release

# Builds all five distro/bundle formats under packaging/ (.deb, Arch
# .pkg.tar.zst, .rpm, Flatpak, AppImage) and publishes them as assets
# on a GitHub Release. Triggered by pushing a `vX.Y.Z` tag (matching
# the existing tag history - see `git tag -l`), or manually via
# "Run workflow" against an existing tag ref for a re-run (e.g. after
# fixing a build issue without cutting a new tag).
#
# The .deb/.pkg.tar.zst/.rpm builds themselves are NOT redefined here -
# build-packages.yml already builds and artifact-uploads all three on
# every push/PR, so this calls that workflow instead of forking a
# second copy of ~200 lines of container/dependency/build steps that
# would only drift out of sync with it over time. That file's own
# version-stamping steps are gated on `startsWith(github.ref,
# 'refs/tags/')`, which is exactly the condition true here (a tag push
# or a manual run against a tag ref), so the .deb/.rpm produced by this
# call carry the real release version instead of build-packages.yml's
# plain-CI placeholder. Flatpak and AppImage aren't part of that
# reusable workflow (see packaging/flatpak/README.md and
# packaging/appimage/README.md - neither was wired into push/PR CI:
# flatpak-builder needs a ~1GB GNOME runtime pull, and both were only
# "not build-tested end-to-end" placeholders until this workflow's own
# build-flatpak/build-appimage jobs below were confirmed working
# against a real local flatpak-builder/appimagetool).
#
# No package here is signed (same as build-packages.yml's unsigned
# dpkg-buildpackage - no GPG key available in CI) and hyprav-dkms's
# av.ko source still isn't compiled at package-build time in any of
# these (see debian/rules, packaging/arch/PKGBUILD, and
# packaging/fedora/hyprav.spec's own comments) - dkms compiles it on
# the end user's machine, against whatever kernel is really installed
# there.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: read
  # build-daemon/build-module/build-flatpak/build-appimage all end in
  # actions/upload-artifact, which needs actions:write to finalize
  # (bytes upload fine, then FinalizeArtifact 403s without it).
  actions: write

jobs:
  # Reuses build-deb/build-arch/build-rpm as-is (see the header
  # comment above) - this "job" only finishes once all three of those
  # do, and their `actions/upload-artifact` calls land in this same
  # overall run, so publish-release's `actions/download-artifact`
  # below finds deb-packages/arch-packages/rpm-packages exactly like
  # it would from a normal build-packages.yml run.
  build-packages:
    uses: ./.github/workflows/build-packages.yml

  build-flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # flatpak-builder itself is a plain apt package; the actual app
      # build below needs the GNOME 49 Platform+SDK the manifest pins
      # (packaging/flatpak/org.hyprav.avgui.yml's runtime-version) -
      # that's the ~1GB part. --user (no sudo) keeps the whole
      # install/build/bundle sequence under one uid, which is what was
      # confirmed working locally.
      - name: Install flatpak + flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder

      - name: Add Flathub and install the GNOME 49 runtime + SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive \
            flathub org.gnome.Platform//49 org.gnome.Sdk//49

      - name: flatpak-builder
        run: |
          flatpak-builder --user --repo=repo --force-clean \
            build-dir packaging/flatpak/org.hyprav.avgui.yml

      # A single-file bundle (`flatpak install --bundle` on the
      # receiving end) rather than shipping the raw ostree repo - the
      # normal way to hand out a Flatpak as one release asset. Version
      # comes from the tag on a tag-triggered run; workflow_dispatch
      # from a non-tag ref (e.g. testing straight off a branch) falls
      # back to `git describe` like build-appimage.sh already does.
      - name: Bundle into a single-file .flatpak
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="$(git describe --tags --always)"
          flatpak build-bundle repo \
            "hyprav-gui-${VERSION}-x86_64.flatpak" org.hyprav.avgui

      - name: Upload .flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-package
          path: hyprav-gui-*-x86_64.flatpak
          if-no-files-found: error

  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The "continuous" release build, same one used to confirm this
      # script locally - AppImage/AppImageKit doesn't tag stable
      # releases of appimagetool itself, continuous is the one every
      # AppImage build guide points at.
      - name: Download appimagetool
        # -f: a 4xx/5xx response otherwise still exits 0 with the error
        # page saved as the "binary", which chmod +x happily accepts -
        # the failure only surfaces later, confusingly, when
        # build-appimage.sh tries to execute it. --retry/--retry-all-errors
        # covers a transient GitHub Releases hiccup instead of failing
        # the whole job on the first blip.
        run: |
          curl -fsSL --retry 3 --retry-all-errors \
            -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      # appimagetool is itself packaged as a (type-2 runtime) AppImage,
      # which normally needs FUSE to mount itself - GitHub-hosted
      # ubuntu-latest runners are full VMs (not containers) and do
      # carry a FUSE kernel module, but APPIMAGE_EXTRACT_AND_RUN=1
      # sidesteps the mount entirely (extract-and-run instead) so this
      # doesn't depend on that continuing to be true.
      - name: Build AppImage
        env:
          APPIMAGETOOL: /usr/local/bin/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="$(git describe --tags --always)"
          packaging/appimage/build-appimage.sh "$VERSION"

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage-package
          path: packaging/appimage/*.AppImage
          if-no-files-found: error

  publish-release:
    needs: [build-packages, build-flatpak, build-appimage]
    # Only actually publish on a real tag push - a manual
    # workflow_dispatch off a branch (e.g. to smoke-test this workflow
    # itself) still builds every package above but stops short of
    # creating/overwriting a public release.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Job-level permissions replace the top-level block wholesale, so
      # the top-level actions:write above does not reach this job:
      # re-grant the minimum the download-artifact step needs.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Collect release assets
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          find dist -type f \( \
              -name '*.deb' -o \
              -name '*.pkg.tar.zst' -o \
              -name '*.rpm' -o \
              -name '*.flatpak' -o \
              -name '*.AppImage' \
            \) -exec cp {} release-assets/ \;
          ls -la release-assets

      # Idempotent: a workflow_dispatch re-run against a tag that
      # already has a release (e.g. re-running after fixing a build
      # issue, without cutting a new tag) uploads the fresh assets
      # onto the existing release instead of failing on "a release
      # with this tag already exists".
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
